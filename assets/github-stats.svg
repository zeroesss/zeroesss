  <circle cx="48" cy="127" r="5" fill="#38BDF8"/><text x="64" y="132" class="label">Tracked repositories</text><text x="620" y="132" class="value" text-anchor="end">11</text>
  <circle cx="48" cy="162" r="5" fill="#8B5CF6"/><text x="64" y="167" class="label">Core stack</text><text x="620" y="167" class="value" text-anchor="end">Python · TypeScript · PHP · JavaScript</text>
  <circle cx="48" cy="197" r="5" fill="#22C55E"/><text x="64" y="202" class="label">Main domain</text><text x="620" y="202" class="value" text-anchor="end">CRM · Bots · Automation</text>
