    <linearGradient id="accent" x1="0" y1="0" x2="600" y2="0"><stop stop-color="#38BDF8"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <style>
      .title { font: 700 25px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .sub { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #94A3B8; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #CBD5E1; }
      .value { font: 700 15px 'SFMono-Regular', Consolas, monospace; fill: #E2E8F0; }
    </style>
  </defs>
  <rect x="1" y="1" width="678" height="258" rx="18" fill="url(#bg)" stroke="#243044"/>
