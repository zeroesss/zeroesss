<svg width="760" height="310" viewBox="0 0 760 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub / private work footprint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font: 700 28px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .sub { font: 500 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #94A3B8; }
      .label { font: 600 17px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #CBD5E1; }
      .value { font: 700 17px 'JetBrains Mono', 'SFMono-Regular', monospace; fill: #E2E8F0; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="308" rx="22" fill="url(#bg)" stroke="#263244"/>
  <rect x="28" y="28" width="704" height="4" rx="2" fill="url(#line)" filter="url(#glow)"/>
  <text x="44" y="72" class="title">GitHub / private work footprint</text>
  <text x="44" y="96" class="sub">Aggregated profile overview — private repo names are not exposed</text>
  <circle cx="52" cy="107" r="5" fill="#36BCF7"/><text x="68" y="112" class="label">Total repositories</text><text x="708" y="112" class="value" text-anchor="end">11</text><circle cx="52" cy="141" r="5" fill="#7C3AED"/><text x="68" y="146" class="label">Private production repos</text><text x="708" y="146" class="value" text-anchor="end">8</text><circle cx="52" cy="175" r="5" fill="#22C55E"/><text x="68" y="180" class="label">Public repositories</text><text x="708" y="180" class="value" text-anchor="end">3</text><circle cx="52" cy="209" r="5" fill="#F59E0B"/><text x="68" y="214" class="label">Main focus</text><text x="708" y="214" class="value" text-anchor="end">CRM · Bots · Automation · Infrastructure</text><circle cx="52" cy="243" r="5" fill="#EF4444"/><text x="68" y="248" class="label">Work style</text><text x="708" y="248" class="value" text-anchor="end">Production-first systems engineering</text>
</svg>